<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurant Render Views</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f3efe8; --muted:#b9b1a5; --paper:#f6f2ea; --char:#151311; --char2:#1f1c19;
  --red:#c8321f; --line:rgba(243,239,232,.18);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:Manrope,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0c0b0a;color:var(--ink);font-family:var(--sans);overflow:hidden}
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;background:var(--char);overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .55s ease,visibility 0s linear .55s}
.slide.on{opacity:1;visibility:visible;transition:opacity .55s ease}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#222}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,11,10,0) 55%,rgba(12,11,10,.55) 78%,rgba(12,11,10,.86) 100%)}
.shade.top{background:linear-gradient(180deg,rgba(12,11,10,.55) 0%,rgba(12,11,10,0) 18%)}

/* header strip on every view */
.hdr{position:absolute;left:64px;right:64px;top:44px;display:flex;justify-content:space-between;align-items:center;
  font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:rgba(243,239,232,.82)}
.hdr b{font-weight:700;color:var(--ink)}

/* caption block */
.cap{position:absolute;left:64px;bottom:60px;width:1180px}
.cap .no{font-family:var(--sans);font-size:16px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);display:flex;gap:18px;align-items:center}
.cap .no i{display:inline-block;width:46px;height:2px;background:var(--red)}
.cap h2{font-family:var(--serif);font-weight:600;font-size:76px;line-height:1.02;margin:14px 0 14px;letter-spacing:.005em}
.cap p{font-size:22px;line-height:1.5;color:#e2dbd0;max-width:980px}

/* key plan card */
.kp{position:absolute;right:56px;bottom:52px;width:560px;background:var(--paper);color:#1d1b18;border-radius:4px;
  box-shadow:0 18px 50px rgba(0,0,0,.45);padding:16px 18px 14px}
.kp .t{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;margin-bottom:10px}
.kp .t span:last-child{color:#7c746a;font-weight:500}
.kp svg{display:block;width:100%;height:auto;background:#fff}
.kp .f{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px;color:#6d665d;letter-spacing:.06em}
.kp .f .lg{display:flex;align-items:center;gap:8px}
.kp .f .lg svg{width:22px;height:16px;background:none}

/* cover */
.cover .shade{background:linear-gradient(90deg,rgba(12,11,10,.92) 0%,rgba(12,11,10,.72) 40%,rgba(12,11,10,.1) 75%)}
.cover .in{position:absolute;left:110px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:880px}
.cover .kick{font-size:17px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:18px}
.cover .kick i{width:56px;height:2px;background:var(--red)}
.cover h1{font-family:var(--serif);font-weight:600;font-size:132px;line-height:.95;margin:34px 0 26px}
.cover .sub{font-family:var(--serif);font-size:40px;color:#e7e0d4}
.cover .meta{margin-top:70px;display:flex;gap:56px;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.cover .meta b{display:block;font-family:var(--serif);font-size:54px;letter-spacing:0;color:var(--ink);font-weight:600;margin-bottom:6px;text-transform:none}

/* floor index */
.idx{background:var(--char)}
.idx .side{position:absolute;left:72px;top:72px;bottom:72px;width:430px;display:flex;flex-direction:column}
.idx .side .kick{font-size:15px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.idx .side h2{font-family:var(--serif);font-weight:600;font-size:92px;line-height:1;margin:18px 0 10px}
.idx .side .d{font-size:18px;color:#cfc7bb;line-height:1.55;margin-bottom:30px}
.idx ol{list-style:none;overflow:hidden;flex:1;columns:1}
.idx li{display:flex;gap:16px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);font-size:17px;cursor:pointer;color:#e7e0d4}
.idx li:hover{color:#fff}
.idx li em{font-style:normal;font-weight:700;color:var(--red);width:30px;flex:none;font-size:15px}
.idx li small{color:var(--muted);font-size:14px;margin-left:auto;white-space:nowrap}
.idx .plan{position:absolute;right:72px;top:72px;width:1330px;background:#fff;border-radius:4px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.4)}
.idx .plan svg{display:block;width:100%;height:auto}
.idx .plan .vm{cursor:pointer}
.idx .plan .vm:hover path{fill-opacity:.45}
.idx .note{margin-top:14px;display:flex;color:#6d665d !important;justify-content:space-between;font-size:15px;color:var(--muted);letter-spacing:.04em}

/* chrome */
#bar{position:fixed;left:0;bottom:0;height:3px;background:var(--red);transition:width .45s ease;z-index:5}
#nav{position:fixed;left:50%;transform:translateX(-50%);top:14px;display:flex;gap:8px;z-index:6;opacity:.0;transition:opacity .3s}
body:hover #nav{opacity:1}
#nav button{background:rgba(20,18,16,.72);color:var(--ink);border:1px solid rgba(255,255,255,.16);border-radius:3px;padding:8px 13px;font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
#nav button:hover{background:rgba(200,50,31,.85)}
#grid{position:fixed;inset:0;background:rgba(10,9,8,.97);z-index:10;display:none;overflow:auto;padding:46px 54px}
#grid.on{display:block}
#grid h3{font:600 15px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin:8px 0 18px}
#grid .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:34px}
#grid figure{cursor:pointer;position:relative}
#grid img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:3px;outline:2px solid transparent;transition:outline-color .2s}
#grid figure:hover img{outline-color:var(--red)}
#grid figcaption{font-size:13px;color:#d9d2c6;margin-top:7px}
#grid figcaption b{color:var(--red);margin-right:8px}
.hint{position:fixed;left:50%;top:66px;transform:translateX(-50%);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:rgba(243,239,232,.55);z-index:6;transition:opacity 1s}
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="bar"></div>
<div id="nav">
  <button id="bPrev" title="Previous (←)">‹ Prev</button>
  <button id="bGrid" title="All views (G)">All views</button>
  <button id="bFull" title="Fullscreen (F)">Fullscreen</button>
  <button id="bNext" title="Next (→)">Next ›</button>
</div>
<div id="grid"></div>
<div class="hint" id="hint">← → to navigate · G all views · F fullscreen</div>

<script>
const VIEWS = [{"n": 1, "floor": "GF", "area": "Front Outdoor Dining", "file": "Outdoor_Dining_Area_Front_Ground_Floor_00", "cam": [432, 566], "ang": -1.5708, "cap": "Looking in from the front court, a dining bay set between planters, framed by the arched timber jaali."}, {"n": 2, "floor": "GF", "area": "Front Outdoor Dining", "file": "Outdoor_Dining_Area_Front_Ground_Floor_01", "cam": [753, 563], "ang": 3.1416, "cap": "Along the front colonnade, the planter-lined dining bays to the right and the cobbled walk ahead."}, {"n": 3, "floor": "GF", "area": "Front Outdoor Dining", "file": "Outdoor_Dining_Area_Front_Ground_Floor_02", "cam": [497, 569], "ang": -0.5734, "cap": "Diagonal view across the bays, through the arches to the red stair beyond."}, {"n": 4, "floor": "GF", "area": "Restaurant", "file": "Ground_Floor_Restaurent__View_00", "cam": [393, 347], "ang": 0.0, "cap": "From the kitchen end, down the length of the dining hall toward the red banquette."}, {"n": 5, "floor": "GF", "area": "Restaurant", "file": "Ground_Floor_Restaurent__View_01", "cam": [654, 308], "ang": 0.3903, "cap": "The banquette corner, with arched jaali openings to the outdoor bays."}, {"n": 6, "floor": "GF", "area": "Restaurant", "file": "Ground_Floor_Restaurent_Looking_At_Spiral_Staircase_View_07", "cam": [722, 372], "ang": -1.3353, "cap": "Looking up at the sculpted red spiral stair to the first floor."}, {"n": 7, "floor": "GF", "area": "Semi-Outdoor Dining", "file": "Ground_Floor_Semi_Outdoor_Restaurent_View_00", "cam": [445, 137], "ang": 1.9234, "cap": "From the rear verandah into a bench bay, the arch opening back into the hall."}, {"n": 8, "floor": "GF", "area": "Semi-Outdoor Dining", "file": "Ground_Floor_Semi_Outdoor_Restaurent_View_01", "cam": [720, 131], "ang": -3.1023, "cap": "Rear verandah tables against the timber louvre screen."}, {"n": 9, "floor": "GF", "area": "Semi-Outdoor Dining", "file": "Ground_Floor_Semi_Outdoor_Restaurent_View_03", "cam": [523, 131], "ang": 0.0, "cap": "Down the louvred verandah toward the garden arch and the courtyard beyond."}, {"n": 10, "floor": "GF", "area": "Outdoor Seating & Campfire", "file": "Ground_Floor_Outdoor_Sittng_Area_Campfire_Area_View_04", "cam": [846, 569], "ang": -1.5708, "cap": "Entering the landscape court from the front, past the dining benches."}, {"n": 11, "floor": "GF", "area": "Outdoor Seating & Campfire", "file": "Ground_Floor_Outdoor_Sittng_Area_Campfire_Area_View_00", "cam": [882, 209], "ang": 1.7819, "cap": "Serpentine planter-benches running along the building's flank."}, {"n": 12, "floor": "GF", "area": "Outdoor Seating & Campfire", "file": "Ground_Floor_Outdoor_Sittng_Area_Campfire_Area_View_02", "cam": [1044, 335], "ang": -2.9617, "cap": "Looking back from the campfire court toward the restaurant."}, {"n": 13, "floor": "GF", "area": "Outdoor Seating & Campfire", "file": "Ground_Floor_Outdoor_Sittng_Area_Campfire_Area_View_03", "cam": [965, 335], "ang": -0.0348, "cap": "Into the campfire court, a curved red-based bench wrapping the gathering space."}, {"n": 14, "floor": "FF", "area": "Restaurant", "file": "First_Floor_Restaurent_View_05", "cam": [661, 281], "ang": 3.1416, "cap": "Upper dining room, looking west through the glazed partition to the party hall."}, {"n": 15, "floor": "FF", "area": "Restaurant", "file": "First_Floor_Restaurent_View_06", "cam": [419, 314], "ang": -0.1007, "cap": "Toward the east gable wall with its arched jaali windows."}, {"n": 16, "floor": "FF", "area": "Restaurant", "file": "First_Floor_Restaurent_View_04", "cam": [772, 510], "ang": 3.1416, "cap": "The south dining room under the timber-slat ceiling, with the open timber frame to the left."}, {"n": 17, "floor": "FF", "area": "Party Hall", "file": "First_Floor_Party_Hall_00", "cam": [353, 216], "ang": 2.0803, "cap": "From the back of the hall over the seating toward the louvred front."}, {"n": 18, "floor": "FF", "area": "Party Hall", "file": "First_Floor_Party_Hall_01", "cam": [327, 497], "ang": -2.125, "cap": "From the front, back over the seating to the arched jaali windows."}, {"n": 19, "floor": "FF", "area": "Party Hall", "file": "First_Floor_Party_Hall_02", "cam": [150, 419], "ang": -0.5796, "cap": "Across the seating toward the glazed partition into the restaurant."}];
const VB = "48 52 1078 568";
const FL = {GF:{name:"Ground Floor", base:"keyplan/Ground_Floor_Keyplan_Base.svg"},
            FF:{name:"First Floor",  base:"keyplan/First_Floor_Keyplan_Base.svg"}};
const PROJECT = "Proposed Restaurant @ Narayanamangalam, Kerala";
const NS = "http://www.w3.org/2000/svg";
const [vx,vy,vw,vh] = VB.split(" ").map(Number);
const pad = n => String(n).padStart(2,"0");
const total = VIEWS.length;

function marker(v, o={}){
  const r=o.r||13, L=o.L||85, fs=o.fs||13, sw=o.sw||1.8, h=0.56, [cx,cy]=v.cam, a=v.ang;
  const p=(ang,len)=>[(cx+len*Math.cos(ang)).toFixed(1),(cy+len*Math.sin(ang)).toFixed(1)];
  const [x1,y1]=p(a-h,L), [x2,y2]=p(a+h,L), [ax,ay]=p(a,r+L*0.32);
  return `<g class="vm" data-v="${v.n}">
    <path d="M${cx} ${cy}L${x1} ${y1}A${L} ${L} 0 0 1 ${x2} ${y2}Z" fill="#c8321f" fill-opacity=".26" stroke="#c8321f" stroke-width="${sw}"/>
    <line x1="${cx}" y1="${cy}" x2="${ax}" y2="${ay}" stroke="#c8321f" stroke-width="${sw*1.6}" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#c8321f" stroke="#fff" stroke-width="${sw*1.3}"/>
    <text x="${cx}" y="${cy+fs*0.36}" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="${fs}" font-weight="700" fill="#fff">${pad(v.n)}</text></g>`;
}
function ghost(v){ return `<circle cx="${v.cam[0]}" cy="${v.cam[1]}" r="10" fill="#8a837b" fill-opacity=".6"/>`; }
function north(x,y,s=1){ // sheet north arrow points down
  return `<g transform="translate(${x} ${y}) scale(${s})"><circle r="20" fill="#fff" stroke="#1d1b18" stroke-width="2"/>
  <path d="M0 -12 L0 12 M-7 4 L0 14 L7 4" fill="none" stroke="#1d1b18" stroke-width="2.4" stroke-linejoin="round"/>
  <text y="-26" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d1b18">N</text></g>`;
}
function planSVG(floor, inner){
  return `<svg viewBox="${VB}" xmlns="${NS}" role="img" aria-label="${FL[floor].name} key plan">
    <image href="${FL[floor].base}" x="${vx}" y="${vy}" width="${vw}" height="${vh}"/>${inner}
    ${north(vx+vw-46, vy+vh-60, 1.25)}</svg>`;
}

// ---------- build slides ----------
const slides = [];
function add(html, cls, img){ slides.push({html, cls, img}); }

add(`<img class="bg" data-src="renders/Ground_Floor_Restaurent__View_00.jpg" alt="">
  <div class="shade"></div>
  <div class="in">
    <div class="kick"><i></i>Render Views · Batch 00</div>
    <h1>Proposed Restaurant</h1>
    <div class="sub">Narayanamangalam, Kerala</div>
    <div class="meta">
      <div><b>${total}</b>Rendered views</div>
      <div><b>${VIEWS.filter(v=>v.floor=="GF").length}</b>Ground floor</div>
      <div><b>${VIEWS.filter(v=>v.floor=="FF").length}</b>First floor</div>
    </div>
  </div>`, "cover");

const slideOfView = {};
for (const fl of ["GF","FF"]){
  const vs = VIEWS.filter(v=>v.floor==fl);
  const shown = vs.filter(v=>true);
  const areas = [...new Set(vs.map(v=>v.area))];
  add(`<div class="side">
      <div class="kick">Key plan · view positions</div>
      <h2>${FL[fl].name}</h2>
      <div class="d">${areas.join(" · ")}</div>
      <ol>${vs.map(v=>`<li data-go="${v.n}"><em>${pad(v.n)}</em>${v.area}<small>${v.file.match(/(\d+)$/)[1] ? "View "+v.file.match(/(\d+)$/)[1] : ""}</small></li>`).join("")}</ol>
    </div>
    <div class="plan">${planSVG(fl, shown.map(v=>marker(v)).join(""))}
    <div class="note"><span>Red dot = camera position · wedge = view direction &amp; field of view</span><span>${fl=="GF"?"Click a marker or a view to open it":"Click a marker or a view to open it"}</span></div></div>`, "idx");
  for (const v of vs){
    slideOfView[v.n] = slides.length;
    const others = vs.filter(o=>o.n!==v.n).map(ghost).join("");
    add(`<img class="bg" data-src="renders/${v.file}.jpg" alt="${v.area}, view ${v.n}">
      <div class="shade top"></div><div class="shade"></div>
      <div class="hdr"><span>${PROJECT}</span><span><b>${pad(v.n)}</b> / ${pad(total)}</span></div>
      <div class="cap">
        <div class="no"><i></i>${FL[fl].name} · View ${pad(v.n)}</div>
        <h2>${v.area}</h2>
        <p>${v.cap}</p>
      </div>
      <div class="kp">
        <div class="t"><span>Key plan</span><span>${FL[fl].name}</span></div>
        ${planSVG(fl, others + marker(v,{r:24,L:175,fs:22,sw:3.4}))}
        <div class="f"><span class="lg"><svg viewBox="0 0 22 16"><path d="M2 8 L20 1 A18 18 0 0 1 20 15 Z" fill="#c8321f" fill-opacity=".3" stroke="#c8321f"/><circle cx="3" cy="8" r="3" fill="#c8321f"/></svg>Camera &amp; view direction</span><span>${v.file.replace(/_/g," ")}</span></div>
      </div>`, "view", v.file);
  }
}

const stage = document.getElementById("stage");
slides.forEach((s,i)=>{ const d=document.createElement("section"); d.className="slide "+s.cls; d.innerHTML=s.html; d.dataset.i=i; stage.appendChild(d); s.el=d; });

// ---------- navigation ----------
let cur = 0;
function load(i){ const s=slides[i]; if(!s) return; s.el.querySelectorAll("img[data-src]").forEach(im=>{ im.src=im.dataset.src; im.removeAttribute("data-src"); }); }
function go(i){
  i = Math.max(0, Math.min(slides.length-1, i));
  slides[cur].el.classList.remove("on"); cur=i; slides[cur].el.classList.add("on");
  [i,i+1,i+2,i-1].forEach(load);
  document.getElementById("bar").style.width = (100*(cur)/(slides.length-1))+"%";
  try{ history.replaceState(null,"","#"+cur); }catch(e){}
}
function fit(){ const s=Math.min(innerWidth/1920, innerHeight/1080); stage.style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener("resize", fit); fit();

addEventListener("keydown", e=>{
  if (document.getElementById("grid").classList.contains("on")){ if(e.key=="Escape"||e.key=="g"||e.key=="G") toggleGrid(); return; }
  if (["ArrowRight","PageDown"," ","Enter"].includes(e.key)) { e.preventDefault(); go(cur+1); }
  else if (["ArrowLeft","PageUp","Backspace"].includes(e.key)) { e.preventDefault(); go(cur-1); }
  else if (e.key=="Home") go(0); else if (e.key=="End") go(slides.length-1);
  else if (e.key=="g"||e.key=="G") toggleGrid();
  else if (e.key=="f"||e.key=="F") fullscreen();
});
stage.addEventListener("click", e=>{
  const t = e.target.closest("[data-go],.vm");
  if (t){ const n = +(t.dataset.go || t.dataset.v); go(slideOfView[n]); return; }
  if (!slides[cur].el.classList.contains("idx")) go(cur + (e.clientX > innerWidth/2 ? 1 : -1));
});
let tx=null; addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
addEventListener("touchend",e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50) go(cur+(dx<0?1:-1)); tx=null; });
document.getElementById("bPrev").onclick=e=>{e.stopPropagation();go(cur-1)};
document.getElementById("bNext").onclick=e=>{e.stopPropagation();go(cur+1)};
document.getElementById("bGrid").onclick=e=>{e.stopPropagation();toggleGrid()};
document.getElementById("bFull").onclick=e=>{e.stopPropagation();fullscreen()};
function fullscreen(){ try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }catch(e){} }

const grid = document.getElementById("grid");
grid.innerHTML = ["GF","FF"].map(fl=>`<h3>${FL[fl].name}</h3><div class="g">${VIEWS.filter(v=>v.floor==fl).map(v=>
  `<figure data-go="${v.n}"><img loading="lazy" src="renders/${v.file}.jpg" alt=""><figcaption><b>${pad(v.n)}</b>${v.area}</figcaption></figure>`).join("")}</div>`).join("");
grid.addEventListener("click", e=>{ const f=e.target.closest("[data-go]"); if(f){ toggleGrid(); go(slideOfView[+f.dataset.go]); } else toggleGrid(); });
function toggleGrid(){ grid.classList.toggle("on"); }

setTimeout(()=>document.getElementById("hint").style.opacity=0, 4500);
const start = parseInt((location.hash||"#0").slice(1)) || 0;
slides[0].el.classList.add("on"); go(start);
</script>
</body>
</html>
