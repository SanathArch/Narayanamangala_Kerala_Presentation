<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurant Render Views</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f3efe8; --muted:#b9b1a5; --paper:#f6f2ea; --char:#151311; --char2:#1f1c19;
  --red:#c8321f; --line:rgba(243,239,232,.18);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:Manrope,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0c0b0a;color:var(--ink);font-family:var(--sans);overflow:hidden}
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;background:var(--char);overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .55s ease,visibility 0s linear .55s}
.slide.on{opacity:1;visibility:visible;transition:opacity .55s ease}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#222}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,11,10,0) 55%,rgba(12,11,10,.55) 78%,rgba(12,11,10,.86) 100%)}
.shade.top{background:linear-gradient(180deg,rgba(12,11,10,.55) 0%,rgba(12,11,10,0) 18%)}

/* header strip on every view */
.hdr{position:absolute;left:64px;right:64px;top:44px;display:flex;justify-content:space-between;align-items:center;
  font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:rgba(243,239,232,.82)}
.hdr b{font-weight:700;color:var(--ink)}

/* caption block */
.cap{position:absolute;left:64px;bottom:60px;width:1180px}
.cap .no{font-family:var(--sans);font-size:16px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);display:flex;gap:18px;align-items:center}
.cap .no i{display:inline-block;width:46px;height:2px;background:var(--red)}
.cap h2{font-family:var(--serif);font-weight:600;font-size:76px;line-height:1.02;margin:14px 0 14px;letter-spacing:.005em}
.cap p{font-size:22px;line-height:1.5;color:#e2dbd0;max-width:980px}

/* key plan card */
.kp{position:absolute;right:56px;bottom:52px;width:560px;background:var(--paper);color:#1d1b18;border-radius:4px;
  box-shadow:0 18px 50px rgba(0,0,0,.45);padding:16px 18px 14px}
.kp .t{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;margin-bottom:10px}
.kp .t span:last-child{color:#7c746a;font-weight:500}
.kp svg{display:block;width:100%;height:auto;background:#fff}
.kp .f{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px;color:#6d665d;letter-spacing:.06em}
.kp .f .lg{display:flex;align-items:center;gap:8px}
.kp .f .lg svg{width:22px;height:16px;background:none}

/* cover */
.cover .shade{background:linear-gradient(90deg,rgba(12,11,10,.92) 0%,rgba(12,11,10,.72) 40%,rgba(12,11,10,.1) 75%)}
.cover .in{position:absolute;left:110px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:880px}
.cover .kick{font-size:17px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:18px}
.cover .kick i{width:56px;height:2px;background:var(--red)}
.cover h1{font-family:var(--serif);font-weight:600;font-size:132px;line-height:.95;margin:34px 0 26px}
.cover .sub{font-family:var(--serif);font-size:40px;color:#e7e0d4}
.cover .meta{margin-top:70px;display:flex;gap:56px;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.cover .meta b{display:block;font-family:var(--serif);font-size:54px;letter-spacing:0;color:var(--ink);font-weight:600;margin-bottom:6px;text-transform:none}

/* floor index */
.idx{background:var(--char)}
.idx .side{position:absolute;left:72px;top:72px;bottom:72px;width:430px;display:flex;flex-direction:column}
.idx .side .kick{font-size:15px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.idx .side h2{font-family:var(--serif);font-weight:600;font-size:92px;line-height:1;margin:18px 0 10px}
.idx .side .d{font-size:18px;color:#cfc7bb;line-height:1.55;margin-bottom:30px}
.idx ol{list-style:none;overflow:hidden;flex:1;columns:1}
.idx li{display:flex;gap:16px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);font-size:17px;cursor:pointer;color:#e7e0d4}
.idx li:hover{color:#fff}
.idx li em{font-style:normal;font-weight:700;color:var(--red);width:30px;flex:none;font-size:15px}
.idx li small{color:var(--muted);font-size:14px;margin-left:auto;white-space:nowrap}
.idx .plan{position:absolute;right:72px;top:72px;width:1330px;background:#fff;border-radius:4px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.4)}
.idx .plan svg{display:block;width:100%;height:auto}
.idx .plan .vm{cursor:pointer}
.idx .plan .vm:hover path{fill-opacity:.45}
.idx .note{margin-top:14px;display:flex;color:#6d665d !important;justify-content:space-between;font-size:15px;color:var(--muted);letter-spacing:.04em}

/* chrome */
#bar{position:fixed;left:0;bottom:0;height:3px;background:var(--red);transition:width .45s ease;z-index:5}
#nav{position:fixed;left:50%;transform:translateX(-50%);top:14px;display:flex;gap:8px;z-index:6;opacity:.0;transition:opacity .3s}
body:hover #nav{opacity:1}
#nav button{background:rgba(20,18,16,.72);color:var(--ink);border:1px solid rgba(255,255,255,.16);border-radius:3px;padding:8px 13px;font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
#nav button:hover{background:rgba(200,50,31,.85)}
#grid{position:fixed;inset:0;background:rgba(10,9,8,.97);z-index:10;display:none;overflow:auto;padding:46px 54px}
#grid.on{display:block}
#grid h3{font:600 15px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin:8px 0 18px}
#grid .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:34px}
#grid figure{cursor:pointer;position:relative}
#grid :is(img,canvas){width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:3px;outline:2px solid transparent;transition:outline-color .2s}
#grid figure:hover :is(img,canvas){outline-color:var(--red)}
#grid figcaption{font-size:13px;color:#d9d2c6;margin-top:7px}
#grid figcaption b{color:var(--red);margin-right:8px}
.hint{position:fixed;left:50%;top:66px;transform:translateX(-50%);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:rgba(243,239,232,.55);z-index:6;transition:opacity 1s}
#grid .gclose{position:sticky;top:0;float:right;z-index:2;background:rgba(20,18,16,.85);color:var(--ink);border:1px solid rgba(255,255,255,.16);border-radius:3px;padding:8px 13px;font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
#grid .gclose:hover{background:rgba(200,50,31,.85)}
.mk-m{display:none}

/* ---------- fluid layout: phones, small tablets, short windows ----------
   The 1920x1080 stage is kept for laptops / projectors. When it would scale
   below ~55% (text too small to read) the script adds .fluid and the slides
   reflow to the screen instead of being shrunk. */
@media (hover:none){ #nav{opacity:1} }
#stage.fluid{left:0;top:0;width:100%;height:100%}
#stage.fluid .slide{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#stage.fluid .mk-d{display:none}
#stage.fluid .mk-m{display:inline}

/* view slides */
#stage.fluid .view{display:flex;flex-direction:column}
#stage.fluid .view .shade{display:none}
#stage.fluid .hdr{position:relative;left:auto;right:auto;top:auto;order:0;gap:14px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;font-size:10px;letter-spacing:.18em}
#stage.fluid .hdr span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stage.fluid .hdr span:last-child{flex:none}
#stage.fluid .view .bg{position:relative;inset:auto;height:auto;aspect-ratio:16/10;flex:none;order:1}
#stage.fluid .cap{position:relative;left:auto;bottom:auto;width:auto;order:2;padding:18px 16px 0}
#stage.fluid .cap .no{font-size:11px;letter-spacing:.18em;gap:10px}
#stage.fluid .cap .no i{width:28px}
#stage.fluid .cap h2{font-size:clamp(30px,8vw,52px);margin:8px 0}
#stage.fluid .cap p{font-size:15px}
#stage.fluid .kp{position:relative;right:auto;bottom:auto;width:auto;max-width:600px;order:3;margin:18px 16px 0;padding:12px 12px 10px;box-shadow:none}
#stage.fluid .kp .t{font-size:11px;margin-bottom:8px}
#stage.fluid .kp .f{font-size:10px;gap:10px}
#stage.fluid .kp .f>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* cover */
#stage.fluid .cover .shade{background:linear-gradient(180deg,rgba(12,11,10,.3) 0%,rgba(12,11,10,.55) 40%,rgba(12,11,10,.93) 100%)}
#stage.fluid .cover .in{left:0;right:0;width:auto;justify-content:flex-end;padding:24px 20px calc(96px + env(safe-area-inset-bottom,0px))}
#stage.fluid .cover .kick{font-size:11px;letter-spacing:.24em;gap:12px}
#stage.fluid .cover .kick i{width:32px}
#stage.fluid .cover h1{font-size:clamp(44px,12vw,96px);margin:18px 0 12px}
#stage.fluid .cover .sub{font-size:clamp(20px,5.4vw,32px)}
#stage.fluid .cover .meta{margin-top:28px;gap:clamp(18px,6vw,40px);font-size:10px;letter-spacing:.14em}
#stage.fluid .cover .meta b{font-size:clamp(30px,8vw,44px)}

/* floor index */
#stage.fluid .idx{padding-top:calc(22px + env(safe-area-inset-top,0px));padding-left:16px;padding-right:16px}
#stage.fluid .idx .side{position:relative;left:auto;top:auto;bottom:auto;width:auto}
#stage.fluid .idx .side .kick{font-size:11px}
#stage.fluid .idx .side h2{font-size:clamp(40px,10vw,64px);margin:10px 0 6px}
#stage.fluid .idx .side .d{font-size:15px;margin-bottom:16px}
#stage.fluid .idx ol{overflow:visible;flex:none}
#stage.fluid .idx li{font-size:15px;padding:11px 0}
#stage.fluid .idx .plan{position:relative;right:auto;top:auto;width:auto;margin-top:22px;padding:10px}
#stage.fluid .idx .note{font-size:11px;flex-wrap:wrap;gap:6px 16px;margin-top:10px}

/* chrome in fluid mode */
body.fluid #nav{opacity:1;top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));gap:6px}
body.fluid #nav button{white-space:nowrap;padding:10px 14px;background:rgba(20,18,16,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
body.fluid .hint{top:auto;bottom:calc(70px + env(safe-area-inset-bottom,0px));width:max-content;max-width:90vw;text-align:center;font-size:10px}
body.fluid #grid{padding:16px}
body.fluid #grid .g{grid-template-columns:repeat(auto-fill,minmax(min(260px,40vw),1fr));gap:12px;margin-bottom:26px}
body.fluid #grid figcaption{font-size:12px}
@media (max-width:480px){ body.fluid #bFull{display:none} }

/* phones held sideways: picture beside the text */
@media (orientation:landscape){
  #stage.fluid .view{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-rows:auto auto 1fr;column-gap:20px;padding-left:16px;padding-right:16px}
  #stage.fluid .hdr{grid-column:1/-1;padding-left:0;padding-right:0}
  #stage.fluid .view .bg{grid-column:1;grid-row:2/4;border-radius:3px}
  #stage.fluid .cap{grid-column:2;padding:0}
  #stage.fluid .cap h2{font-size:clamp(26px,4.4vw,44px)}
  #stage.fluid .cap p{font-size:14px}
  #stage.fluid .kp{grid-column:2;margin:14px 0 0;max-width:none}
  #stage.fluid .cover .shade{background:linear-gradient(90deg,rgba(12,11,10,.92) 0%,rgba(12,11,10,.7) 45%,rgba(12,11,10,.2) 85%)}
  #stage.fluid .cover .in{justify-content:center;padding-bottom:56px;max-width:720px}
  #stage.fluid .idx{display:grid;grid-template-columns:minmax(220px,.8fr) minmax(0,1.3fr);gap:24px;align-items:start}
  #stage.fluid .idx .plan{margin-top:0}
  #stage.fluid .idx .side h2{font-size:clamp(32px,5vw,56px)}
}
@media (orientation:landscape) and (max-height:480px){
  #stage.fluid .cover h1{font-size:clamp(36px,7vw,64px);margin:10px 0 8px}
  #stage.fluid .cover .meta{margin-top:16px}
  #stage.fluid .cover .meta b{font-size:30px}
}

/* ---------- image protection: no drag, no long-press save, no selection ---------- */
:is(img,canvas),svg,image{-webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* ---------- render viewer: click a picture -> full view with dark / light switch, Esc to go back ---------- */
.view .bg,.view .shade{cursor:zoom-in}
.vbtn{position:absolute;left:64px;top:96px;z-index:3;display:flex;align-items:center;gap:10px;background:rgba(12,11,10,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  color:var(--ink);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:10px 18px;font:700 14px var(--sans);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:background .25s}
.vbtn:hover{background:rgba(200,50,31,.85)}
.vbtn svg{width:18px;height:18px;flex:none}
#stage.fluid .vbtn{left:26px;top:calc(50px + env(safe-area-inset-top,0px));font-size:10px;padding:7px 12px;gap:7px}
#stage.fluid .vbtn svg{width:13px;height:13px}

#vw{position:fixed;inset:0;z-index:30;background:#0a0908;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s}
#vw.on{opacity:1;visibility:visible;transition:opacity .35s ease}
.vw-top{flex:none;display:flex;align-items:center;gap:clamp(10px,2vw,24px);padding:calc(12px + env(safe-area-inset-top,0px)) clamp(12px,3vw,32px) 12px}
.vw-t{flex:1;min-width:0;display:flex;gap:12px;align-items:baseline;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vw-t b{color:var(--ink);font-weight:700}
.vw-t span{overflow:hidden;text-overflow:ellipsis}
.vw-mode{flex:none;display:flex;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:3px;background:rgba(255,255,255,.04)}
.vw-mode button{appearance:none;border:0;background:transparent;color:var(--muted);font:700 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;padding:8px 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .25s,color .25s}
.vw-mode button svg{width:13px;height:13px;flex:none}
.vw-mode button:hover{color:var(--ink)}
.vw-mode button[aria-pressed="true"]{background:var(--ink);color:var(--char)}
.vw-x{flex:none;appearance:none;background:rgba(255,255,255,.06);color:var(--ink);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:8px 14px;font:700 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;display:flex;gap:8px;align-items:center}
.vw-x:hover{background:rgba(200,50,31,.85)}
.vw-x kbd{font:inherit;opacity:.65}
.vw-ph{position:relative;flex:1;min-height:0;margin:0 clamp(0px,3vw,32px)}
.vw-ph :is(img,canvas){position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .6s ease}
.vw-ph :is(img,canvas).l{opacity:0}
#vw.light .vw-ph :is(img,canvas).l.ok{opacity:1}
.vw-soon{display:none;position:absolute;left:50%;top:16px;transform:translateX(-50%);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);background:rgba(12,11,10,.7);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 13px;white-space:nowrap}
#vw.light.nol .vw-soon{display:block}
.vw-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(12,11,10,.55);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--ink);font:400 30px/1 var(--sans);cursor:pointer;display:flex;align-items:center;justify-content:center;padding-bottom:4px}
.vw-arrow:hover{background:rgba(200,50,31,.85)}
.vw-arrow:disabled{opacity:.25;cursor:default;background:rgba(12,11,10,.55)}
.vw-arrow.prev{left:clamp(6px,1.6vw,20px)} .vw-arrow.next{right:clamp(6px,1.6vw,20px)}
.vw-cap{flex:none;padding:12px clamp(14px,3vw,32px) calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:14px;line-height:1.5;color:#d9d2c6}
.vw-cap small{display:block;margin-top:4px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(243,239,232,.45)}
#vw button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (max-width:640px){
  .vw-t{font-size:10px;letter-spacing:.14em;gap:8px}
  .vw-t span{display:none}
  .vw-mode button{padding:8px 11px}
  .vw-x kbd{display:none}
  .vw-arrow{width:42px;height:42px;font-size:24px}
  .vw-cap{font-size:13px}
}
@media (hover:none){ .vw-x kbd{display:none} }
@media (orientation:landscape) and (max-height:500px){
  .vw-top{padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:6px}
  .vw-cap{display:none}
}
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="bar"></div>
<div id="nav">
  <button id="bPrev" title="Previous (←)">‹ Prev</button>
  <button id="bGrid" title="All views (G)">All views</button>
  <button id="bFull" title="Fullscreen (F)">Fullscreen</button>
  <button id="bNext" title="Next (→)">Next ›</button>
</div>
<div id="grid"></div>
<div class="hint" id="hint">← → to navigate · G all views · F fullscreen</div>
<div id="vw" role="dialog" aria-modal="true" aria-label="Render viewer" aria-hidden="true">
  <div class="vw-top">
    <div class="vw-t"><b id="vwNo"></b><span id="vwName"></span></div>
    <div class="vw-mode" role="group" aria-label="Render lighting">
      <button type="button" data-m="dark" aria-pressed="true" title="Dark render (D)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z" fill="currentColor"/></svg>Dark</button>
      <button type="button" data-m="light" aria-pressed="false" title="Light render (L)"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9 13 13M13 3l-1.1 1.1M4.1 11.9 3 13"/></g></svg>Light</button>
    </div>
    <button type="button" class="vw-x" id="vwClose" title="Back to slides (Esc)">✕ Close <kbd>Esc</kbd></button>
  </div>
  <div class="vw-ph">
    <canvas class="d" role="img"></canvas><canvas class="l" aria-hidden="true"></canvas>
    <div class="vw-soon">Light render coming soon</div>
    <button type="button" class="vw-arrow prev" title="Previous view (←)" aria-label="Previous view">‹</button>
    <button type="button" class="vw-arrow next" title="Next view (→)" aria-label="Next view">›</button>
  </div>
  <div class="vw-cap" id="vwCap"></div>
</div>

<script>
// ---------- scrambled renders ----------
// The render files are published as shuffled tiles (renders_s/, renders_light_s/). They are put back in
// order here and drawn on <canvas>, so a copied file address or a download from the repo is a jumbled picture.
const SCR = {C:11, R:9, K:0x2f6b1d37, LRU:4};
function scrPerm(name){
  let h=0x811c9dc5; for (let i=0;i<name.length;i++){ h^=name.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
  let a=(h^SCR.K)>>>0; const n=SCR.C*SCR.R, p=[...Array(n).keys()];
  const rnd=()=>{ a=(a+0x6D2B79F5)>>>0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; };
  for (let i=n-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [p[i],p[j]]=[p[j],p[i]]; }
  return p;
}
const scrCache = new Map();   // url -> Promise<full-size unscrambled canvas> (small LRU)
function scrFull(url){
  if (scrCache.has(url)){ const pr=scrCache.get(url); scrCache.delete(url); scrCache.set(url,pr); return pr; }
  const pr = new Promise((res,rej)=>{
    const im = new Image(); im.decoding = "async";
    im.onload = ()=>{

        k === "f12") stop(e);
  }, true);
  const lockImgs = root => root.querySelectorAll("img").forEach(im => { im.draggable = false; im.setAttribute("oncontextmenu","return false"); });
  lockImgs(document);
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => n.querySelectorAll && lockImgs(n.parentNode || n)))).observe(document.body, {childList:true, subtree:true});
})();
</script>
